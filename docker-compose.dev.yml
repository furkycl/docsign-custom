# Development docker-compose — bind-mounts source code for live reload
# Usage: docker compose -f docker-compose.dev.yml up
#
# First run takes ~5-10 min (apk + bundle install + yarn install).
# Subsequent runs are fast because gem cache + node_modules are persisted.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuseal_dev
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ruby:4.0.1-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    working_dir: /app
    ports:
      - "5678:3000"  # host 5678 -> container 3000 (avoid conflicts with other local servers)
      - "3035:3035"  # shakapacker dev server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docuseal_dev
      RAILS_ENV: development
      NODE_ENV: development
      BUNDLE_PATH: /usr/local/bundle
      BINDING: 0.0.0.0
    command: >
      sh -c "
      apk add --no-cache nodejs yarn build-base git libpq-dev yaml-dev tzdata curl wget libpq vips vips-heif redis &&
      if [ ! -f /usr/lib/libpdfium.so ]; then
        echo '==> Downloading libpdfium...';
        ARCH=$$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/');
        wget -q -O /tmp/pdfium.tgz \"https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-musl-$${ARCH}.tgz\" &&
        mkdir -p /tmp/pdfium &&
        tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium &&
        cp /tmp/pdfium/lib/libpdfium.so /usr/lib/libpdfium.so &&
        echo '==> libpdfium installed';
      fi &&
      bundle config set --local force_ruby_platform false &&
      bundle lock --add-platform aarch64-linux-musl x86_64-linux-musl &&
      bundle install --jobs 4 &&
      yarn install &&
      bundle exec rails db:create 2>/dev/null || true &&
      bundle exec rails db:migrate &&
      bundle exec rails runner db/seeds/brands.rb &&
      bundle exec foreman start -f Procfile.dev
      "

volumes:
  pg_dev_data:
  bundle_cache:
  node_modules:
